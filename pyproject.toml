[project]
name = "sova-rag-platform"
version = "0.0.1"
description = "Корневой контейнер для единого виртуального пространства"
requires-python = "==3.14.4"
dependencies = [

]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.9.0",
    "pre-commit>=4.0.0",
    "types-pika>=1.2.0b1",
]

[build-system]
requires = ["uv>=0.5.0"]
build-backend = "uv.build"

[tool.uv]
package = false


[tool.uv.workspace]
members = [
    "shared",
    "gateway",
    "downloadworker",
    "processing_worker",
    "search_service",
    "llm_service",
]


[tool.uv.sources]
gateway           = { workspace = true }
download_worker   = { workspace = true }
processing_worker = { workspace = true }
search_service    = { workspace = true }
llm_service       = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "gateway",
    "download_worker",
    "processing_worker",
    "search_service",
    "llm_service",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["SOVA_RAG_platform/*/tests"]
addopts = "-ra -q --tb=short"

[tool.mypy]
python_version = "3.12"


mypy_path = "shared:gateway:download_worker:processing_worker:search_service:llm_service"
explicit_package_bases = true
namespace_packages = true


packages = ["shared", "gateway", "download_worker", "processing_worker", "search_service", "llm_service"]

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

disallow_untyped_defs = true
disallow_any_unimported = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_incomplete_defs = true

ignore_missing_imports = false
strict_equality = true

exclude = [
    "^tests/",
    "^.venv/",
    "^build/",
    "^dist/",
    "setup.py",
]

plugins = [
    "pydantic.mypy",
]


[[tool.mypy.overrides]]
module = ["config", "settings","pika"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_errors = false
