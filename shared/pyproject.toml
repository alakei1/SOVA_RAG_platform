[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for microservices"
requires-python = ">=3.14"

dependencies = [
    "loguru>=0.7.3",
    "pika>=1.4.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
