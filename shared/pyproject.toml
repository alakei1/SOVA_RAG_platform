
[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for microservices"
requires-python = ">=3.14"

dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
